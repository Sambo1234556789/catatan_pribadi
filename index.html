<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e4fa3">
<title>Catatan Kas Harian</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: form catat di kiri (sticky), ringkasan bulan + grafik harian + buku kas bertab di kanan */
:root{
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#eef3fa; --surface:#ffffff; --surface2:#e1e9f5; --ink:#0f1d33; --muted:#546a88; --line:#cdd9ea;
  --accent:#1e4fa3; --accent-ink:#ffffff;
  --in:#0e7a58; --out:#b93a26; --sav:#96590a; --debt:#6a4bc0; --onc:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1424; --surface:#102039; --surface2:#172b4a; --ink:#e6eefb; --muted:#93a8c8; --line:#243b61;
    --accent:#5b9bff; --accent-ink:#04122b;
    --in:#4cc79a; --out:#f08a74; --sav:#e2a84c; --debt:#b4a2f5; --onc:#08111f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1424; --surface:#102039; --surface2:#172b4a; --ink:#e6eefb; --muted:#93a8c8; --line:#243b61;
  --accent:#5b9bff; --accent-ink:#04122b;
  --in:#4cc79a; --out:#f08a74; --sav:#e2a84c; --debt:#b4a2f5; --onc:#08111f;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-block:20px 90px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto}

/* header */
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.month .lbl{min-width:132px;text-align:center;font-weight:700}
.ib{width:36px;height:36px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-size:20px;line-height:1;display:grid;place-items:center}
.ib:hover{background:var(--surface2)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.main:hover{filter:brightness(1.08)}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--in)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* layout */
.layout{display:grid;grid-template-columns:316px minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card h2{margin:0 0 12px;font-size:16px;font-weight:700}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.formcard{position:static!important}}

/* form */
.formcard{position:sticky;top:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:9px 8px;border:1px solid var(--line);border-radius:10px;font-weight:600;font-size:14px;background:var(--surface)}
.seg input:checked+span{background:var(--c);border-color:var(--c);color:var(--onc)}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.amt{display:flex;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:10px}
.amt span{padding-left:12px;color:var(--muted);font-weight:600}
.amt input{border:0;background:transparent;font-family:var(--mono);font-size:17px}
.amt:focus-within{outline:3px solid var(--accent)}
.amt input:focus-visible{outline:none}
.submit{width:100%;border:0;border-radius:10px;padding:12px;font-weight:700;cursor:pointer;background:var(--c);color:var(--onc)}
.submit:hover{filter:brightness(1.08)}
.err{color:var(--out);font-size:13px;min-height:18px;margin:0 0 6px}

/* summary */
.sum{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.9fr);gap:18px 28px;align-items:center}
.sum-main{display:flex;flex-direction:column;gap:2px}
.sum-main .lbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.big{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.big.neg{color:var(--out)}
.hint{font-size:12.5px;color:var(--muted)}
.sum-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0}
.sum-grid>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.sum-grid dt{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.sum-grid dt::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--c)}
.sum-grid dd{margin:0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.sum-grid small{font-size:11.5px;color:var(--muted)}
@media (max-width:760px){.sum{grid-template-columns:minmax(0,1fr)}.sum-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* chart */
.chart-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.chart-head h2{margin:0}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cscroll{overflow-x:auto}
.cscroll svg{display:block;min-width:600px;width:100%;height:auto}
.ax{fill:var(--muted);font:10px var(--font)}
.ax.today{fill:var(--ink);font-weight:800}
.grid{stroke:var(--line);stroke-width:1}
.cscroll rect.hit{fill:transparent;cursor:pointer}
.cscroll rect.hit:hover{fill:var(--surface2);opacity:.6}
.chart-note{font-size:12px;color:var(--muted);margin:6px 0 0}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px -4px 16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}

.daybar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.daybar input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.ttl{margin:0 0 12px;font-size:17px;font-weight:700;text-transform:capitalize}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 14px;padding:12px;background:var(--surface2);border-radius:12px}
.mini div{display:flex;flex-direction:column;min-width:0}
.mini span{font-size:11.5px;font-weight:700;color:var(--muted)}
.mini b{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.mini.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.mini,.mini.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pos{color:var(--in)}.neg{color:var(--out)}

.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.pill{flex:none;width:68px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 0;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);color:var(--c)}
.r-main{flex:1;min-width:0}
.r-title{font-weight:600;overflow-wrap:anywhere}
.r-sub{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.r-amt{flex:none;font-weight:600;text-align:right}
.row.done .r-title{text-decoration:line-through;color:var(--muted)}
.row.done .r-amt{color:var(--muted)}
.x{flex:none;border:0;background:transparent;width:32px;height:32px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.x:hover{background:var(--surface2);color:var(--out)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px;background:color-mix(in srgb,var(--out) 16%,var(--surface));color:var(--out)}
.badge.ok{background:color-mix(in srgb,var(--in) 16%,var(--surface));color:var(--in)}
.empty{color:var(--muted);padding:18px 0;text-align:center}
@media (max-width:520px){.pill{width:auto;padding:3px 8px}.row{gap:9px}.r-amt{font-size:13px}}

.chk{position:relative;display:inline-grid;place-items:center;width:28px;height:28px;flex:none;cursor:pointer}
.chk input{appearance:none;-webkit-appearance:none;margin:0;width:24px;height:24px;border:2px solid var(--muted);border-radius:7px;background:var(--surface);cursor:pointer;display:grid;place-content:center}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
th{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr.sel td{background:var(--surface2)}
tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--line)}
td small{display:block;color:var(--muted);font-size:11px}
.link{border:0;background:transparent;padding:0;font-weight:600;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--accent)}
.sub-h{font-size:14px;font-weight:700;margin:22px 0 10px}
.cat{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:8px;font-size:13.5px}
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:5px}

/* goal & plan */
.goal{margin-bottom:14px;padding:14px;background:var(--surface2);border-radius:12px}
.goal-top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:10px}
.goal-top label{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.goal-top .amt{background:var(--surface);max-width:210px}
.prog{height:12px;border-radius:6px;background:var(--surface);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--sav)}
.prog-t{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;margin-top:8px;font-size:13px}
.plan{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.plan .amt{background:var(--bg);max-width:190px}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:12px;background:color-mix(in srgb,var(--sav) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--sav) 40%,var(--line));font-size:14px}
.banner b{font-weight:700}

#toast{position:fixed;z-index:20;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));margin:0 auto;max-width:420px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tbtn{border:0;background:transparent;color:inherit;font-weight:800;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.prog i,.bar i{transition:width .3s ease}}
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
.who{font-size:12.5px;color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err.ok{color:var(--in)}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(6,14,30,.6);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.dlg{width:min(420px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.dlg-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dlg-h h2{margin:0;font-size:18px;font-weight:700}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.tabs2 button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px;font-weight:600;cursor:pointer}
.tabs2 button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dlg .link{margin-top:12px;display:block;color:var(--muted);font-weight:500}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Catatan Kas Harian</h1>
      <p>Pemasukan, pengeluaran, tabungan, dan hutang dalam satu tempat</p>
    </div>
    <div class="nav">
      <div class="month">
        <button class="ib" data-act="prev-month" aria-label="Bulan sebelumnya">‹</button>
        <span class="lbl" id="monthLabel"></span>
        <button class="ib" data-act="next-month" aria-label="Bulan berikutnya">›</button>
      </div>
      <button class="btn" data-act="this-month" id="thisMonth">Bulan ini</button>
      <span class="status" id="status">Memuat…</span>
      <span class="who" id="who" hidden></span>
      <button class="btn main" id="authBtn" data-act="auth-open" hidden>Masuk / Daftar</button>
      <button class="btn" id="logoutBtn" data-act="logout" hidden>Keluar</button>
    </div>
  </header>

  <div id="bannerSlot"></div>

  <div class="layout">
    <aside class="card formcard" id="formcard">
      <h2>Catat baru</h2>
      <form id="form" novalidate>
        <div class="seg" role="radiogroup" aria-label="Jenis catatan">
          <label style="--c:var(--in)"><input type="radio" name="ftype" value="in"><span>Pemasukan</span></label>
          <label style="--c:var(--out)"><input type="radio" name="ftype" value="out" checked><span>Pengeluaran</span></label>
          <label style="--c:var(--sav)"><input type="radio" name="ftype" value="sav"><span>Tabungan</span></label>
          <label style="--c:var(--debt)"><input type="radio" name="ftype" value="debt"><span>Hutang</span></label>
        </div>
        <div class="field"><label for="fDate" id="fDateLbl">Tanggal</label><input type="date" id="fDate"></div>
        <div class="field" id="catWrap"><label for="fCat">Kategori</label><select id="fCat"></select></div>
        <div class="field"><label for="fName" id="fNameLbl">Keterangan</label><input type="text" id="fName" maxlength="80" autocomplete="off" placeholder="Contoh: makan siang"></div>
        <div class="field"><label for="fAmt" id="fAmtLbl">Jumlah</label>
          <div class="amt"><span>Rp</span><input type="number" id="fAmt" inputmode="numeric" min="1" step="1" placeholder="0"></div>
        </div>
        <p class="err" id="fErr" role="alert"></p>
        <button class="submit" id="fSubmit" type="submit">Catat pengeluaran</button>
      </form>
    </aside>

    <div class="stack">
      <section class="card sum" id="summary" aria-live="polite"></section>
      <section class="card">
        <div class="chart-head">
          <h2>Grafik harian</h2>
          <div class="legend"><span><i style="background:var(--in)"></i>Pemasukan</span><span><i style="background:var(--out)"></i>Pengeluaran</span></div>
        </div>
        <div class="cscroll" id="chart"></div>
        <p class="chart-note">Ketuk sebuah tanggal untuk melihat rinciannya.</p>
      </section>
      <section class="card">
        <div class="tabs" role="tablist" id="tabs">
          <button role="tab" data-act="tab" data-tab="hari">Per hari</button>
          <button role="tab" data-act="tab" data-tab="bulan">Per bulan</button>
          <button role="tab" data-act="tab" data-tab="tabungan">Tabungan</button>
          <button role="tab" data-act="tab" data-tab="hutang">Hutang</button>
        </div>
        <div id="panel"></div>
      </section>
    </div>
  </div>
</div>
<div id="authBox" class="overlay" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="aTitle">
    <div class="dlg-h"><h2 id="aTitle">Masuk</h2><button class="x" type="button" data-act="auth-close" aria-label="Tutup">&times;</button></div>
    <div class="tabs2" id="aTabs">
      <button type="button" data-act="auth-mode" data-mode="in" aria-pressed="true">Masuk</button>
      <button type="button" data-act="auth-mode" data-mode="up" aria-pressed="false">Daftar</button>
    </div>
    <form id="authForm" novalidate>
      <div class="field" id="aEmailWrap"><label for="aEmail">Email</label><input type="email" id="aEmail" autocomplete="email" inputmode="email"></div>
      <div class="field"><label for="aPass" id="aPassLbl">Kata sandi</label><input type="password" id="aPass" autocomplete="current-password" minlength="6"></div>
      <p class="err" id="aMsg" role="alert"></p>
      <button class="submit" id="aSubmit" type="submit" style="--c:var(--accent);--onc:var(--accent-ink)">Masuk</button>
      <button type="button" class="link" id="aReset" data-act="auth-reset">Lupa kata sandi?</button>
    </form>
    <p class="note">Dengan masuk, catatan Anda tersimpan di akun dan bisa dibuka dari HP maupun laptop.</p>
  </div>
</div>
<div id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
'use strict';
var MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var CAT_IN=['Gaji','Usaha','Bonus','Lainnya'];
var CAT_OUT=['Makan & minum','Transport','Belanja','Tagihan','Pulsa & internet','Kesehatan','Hiburan','Lainnya'];
var LS='catatan-kas-v1';
var $=function(s,r){return (r||document).querySelector(s)};
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var todayStr=function(){return ymd(new Date())};
var rp=function(n){return 'Rp '+Math.round(n).toLocaleString('id-ID')};
var rpS=function(n){return n<0?'−'+rp(-n):rp(n)};
var short=function(n){return n>=1e6?(n/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+' jt':n>=1000?Math.round(n/1000)+' rb':String(n)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var daysIn=function(y,m){return new Date(y,m,0).getDate()};
var sum=function(a){return a.reduce(function(s,x){return s+x.amount},0)};
var uid=function(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)};
function fmtDate(s,o){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('id-ID',o)}
function addDays(s,k){var p=s.split('-').map(Number);return ymd(new Date(p[0],p[1]-1,p[2]+k))}

var V={ym:todayStr().slice(0,7),day:todayStr(),tab:'hari',type:'out'};

/* ---------- penyimpanan: akun Supabase bila sudah masuk, kalau belum di browser ---------- */
var RECOVERY=/type=recovery/.test(location.hash);
var APPCFG=window.APP_CONFIG||{};
var sb=null,user=null,remoteStamp=0,saveTimer=null,saving=false,dirty=false,locked=false,revealed=false;
try{
  if(window.supabase&&APPCFG.SUPABASE_URL&&APPCFG.SUPABASE_ANON_KEY){
    sb=window.supabase.createClient(APPCFG.SUPABASE_URL,APPCFG.SUPABASE_ANON_KEY);
  }
}catch(e){sb=null}
function lsKey(){return user?LS+':'+user.id:LS}
function setStatus(t){
  var e=$('#status');if(!e)return;
  e.textContent=t||(user?'Tersimpan di akun Anda':(sb?'Belum masuk · data hanya di browser ini':'Data hanya di browser ini'));
}
function reveal(){if(revealed)return;revealed=true;var w=$('.wrap');if(w)w.style.visibility=''}
function save(){
  if(locked){toast('Belum terhubung ke akun, perubahan belum bisa disimpan. Muat ulang halaman setelah online.');return}
  dirty=true;setStatus('Menyimpan…');clearTimeout(saveTimer);saveTimer=setTimeout(flush,500);
}
async function flush(){
  if(saving){saveTimer=setTimeout(flush,300);return}
  dirty=false;saving=true;
  var snap=JSON.parse(JSON.stringify(S));
  try{localStorage.setItem(lsKey(),JSON.stringify(snap))}catch(e){}
  var failed=false;
  if(user&&sb){
    try{
      var stamp=new Date().toISOString();
      var r=await sb.from('finance').upsert({user_id:user.id,data:snap,updated_at:stamp});
      if(r.error)throw r.error;
      remoteStamp=Date.parse(stamp);
    }catch(e){failed=true}
  }
  saving=false;
  if(failed){dirty=true;setStatus('Gagal menyimpan, mencoba lagi…');saveTimer=setTimeout(flush,5000);return}
  setStatus();
  if(dirty){saveTimer=setTimeout(flush,100)}
}
async function loadCloud(){
  setStatus('Memuat data…');
  var r;
  try{r=await sb.from('finance').select('data,updated_at').eq('user_id',user.id).maybeSingle()}catch(e){r={error:e}}
  if(r.error){
    var c=null;
    try{var raw=localStorage.getItem(lsKey());if(raw)c=normalize(JSON.parse(raw))}catch(e){}
    S=c||makeSample();locked=true;
    setStatus('Tidak bisa terhubung ke akun, memakai salinan di perangkat');render();return;
  }
  locked=false;
  if(r.data&&r.data.data&&Array.isArray(r.data.data.tx)){
    S=normalize(r.data.data);remoteStamp=Date.parse(r.data.updated_at)||0;
    try{localStorage.setItem(lsKey(),JSON.stringify(S))}catch(e){}
  }else{
    var g=loadLocal();
    S=g||makeSample();
    if(g&&!g.sample)save();
  }
  if(!dirty)setStatus();
  render();
}
async function refresh(){
  if(!user||!sb||dirty||saving)return;
  if(locked){await loadCloud();return}
  var r;
  try{r=await sb.from('finance').select('data,updated_at').eq('user_id',user.id).maybeSingle()}catch(e){return}
  if(r.error||!r.data)return;
  var st=Date.parse(r.data.updated_at)||0;
  if(st>remoteStamp&&!dirty&&!saving&&r.data.data&&Array.isArray(r.data.data.tx)){
    S=normalize(r.data.data);remoteStamp=st;render();
  }
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')refresh()});
window.addEventListener('online',function(){refresh()});

/* ---------- login ---------- */
var authMode='in';
function updateAuthUI(){
  var a=$('#authBtn'),l=$('#logoutBtn'),w=$('#who');
  if(a)a.hidden=!sb||!!user;
  if(l)l.hidden=!user;
  if(w){w.hidden=!user;w.textContent=user?user.email:''}
}
function say(text,ok){var m=$('#aMsg');m.textContent=text;m.className='err'+(ok?' ok':'')}
function setMode(m){
  authMode=m;
  var up=m==='up',nw=m==='new';
  $('#aTitle').textContent=nw?'Buat kata sandi baru':up?'Daftar akun':'Masuk';
  $('#aTabs').hidden=nw;
  $('#aEmailWrap').hidden=nw;
  $('#aPassLbl').textContent=nw?'Kata sandi baru':'Kata sandi';
  $('#aPass').autocomplete=(m==='in')?'current-password':'new-password';
  $('#aSubmit').textContent=nw?'Simpan kata sandi':up?'Daftar':'Masuk';
  $('#aReset').hidden=(m!=='in');
  document.querySelectorAll('#aTabs button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.mode===m?'true':'false')});
  say('');
}
function openAuth(m){
  setMode(m||'in');$('#authBox').hidden=false;
  setTimeout(function(){var f=(m==='new')?$('#aPass'):$('#aEmail');if(f)f.focus()},0);
}
function closeAuth(){$('#authBox').hidden=true}
function authErr(m){
  m=String(m||'');
  if(/invalid login/i.test(m))return 'Email atau kata sandi salah.';
  if(/already registered|already been registered/i.test(m))return 'Email ini sudah terdaftar. Silakan masuk.';
  if(/not confirmed/i.test(m))return 'Email belum dikonfirmasi. Cek kotak masuk Anda.';
  if(/at least|weak/i.test(m))return 'Kata sandi minimal 6 karakter.';
  if(/rate limit|too many|security purposes/i.test(m))return 'Terlalu banyak percobaan. Tunggu beberapa menit lalu coba lagi.';
  if(/valid email|invalid.*email/i.test(m))return 'Format email belum benar.';
  return 'Terjadi masalah: '+m;
}
$('#authForm').addEventListener('submit',async function(e){
  e.preventDefault();if(!sb)return;
  var email=$('#aEmail').value.trim(),pass=$('#aPass').value,btn=$('#aSubmit');
  say('');
  if(authMode!=='new'&&!email){say('Isi email Anda.');return}
  if(pass.length<6){say('Kata sandi minimal 6 karakter.');return}
  btn.disabled=true;
  try{
    var r;
    if(authMode==='in'){
      r=await sb.auth.signInWithPassword({email:email,password:pass});if(r.error)throw r.error;
      closeAuth();toast('Berhasil masuk');
    }else if(authMode==='up'){
      r=await sb.auth.signUp({email:email,password:pass});if(r.error)throw r.error;
      if(r.data&&r.data.session){closeAuth();toast('Akun dibuat dan sudah masuk')}
      else say('Pendaftaran berhasil. Cek email untuk konfirmasi, lalu masuk.',true);
    }else{
      r=await sb.auth.updateUser({password:pass});if(r.error)throw r.error;
      closeAuth();toast('Kata sandi diperbarui');
      try{history.replaceState(null,'',location.pathname)}catch(x){}
    }
    $('#aPass').value='';
  }catch(err){say(authErr(err&&err.message))}
  btn.disabled=false;
});
async function resetPass(){
  var email=$('#aEmail').value.trim();
  if(!email){say('Isi email dulu, lalu tekan Lupa kata sandi.');return}
  try{
    var r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    if(r.error)throw r.error;
    say('Tautan atur ulang kata sandi dikirim ke email Anda.',true);
  }catch(err){say(authErr(err&&err.message))}
}
async function logout(){
  if(!sb||!user)return;
  var uid=user.id;
  if(dirty&&!saving){clearTimeout(saveTimer);await flush()}
  try{localStorage.removeItem(LS+':'+uid)}catch(e){}
  await sb.auth.signOut();
  toast('Anda sudah keluar');
}
document.addEventListener('click',function(e){
  if(e.target.id==='authBox'){closeAuth();return}
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='auth-open')openAuth('in');
  else if(a==='auth-close')closeAuth();
  else if(a==='auth-mode')setMode(b.dataset.mode);
  else if(a==='auth-reset')resetPass();
  else if(a==='logout')logout();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#authBox').hidden&&authMode!=='new')closeAuth()});

function onAuth(){
  updateAuthUI();
  if(user){loadCloud().then(reveal,reveal)}
  else{var g=loadLocal();S=g||makeSample();locked=false;setStatus();render();reveal()}
}
function initAuth(){
  updateAuthUI();
  if(!sb){setStatus();reveal();return}
  var w=$('.wrap');if(w)w.style.visibility='hidden';
  setTimeout(reveal,6000);
  sb.auth.getSession().then(function(r){
    user=(r&&r.data&&r.data.session)?r.data.session.user:null;
    onAuth();
    if(RECOVERY&&user)openAuth('new');
    sb.auth.onAuthStateChange(function(ev,session){
      var nu=session?session.user:null;
      var changed=(nu?nu.id:null)!==(user?user.id:null);
      user=nu;
      if(ev==='PASSWORD_RECOVERY')setTimeout(function(){openAuth('new')},0);
      if(changed)setTimeout(onAuth,0);
    });
  }).catch(function(){user=null;onAuth()});
}

/* ---------- perhitungan ---------- */
function byDay(ym){
  var p=ym.split('-').map(Number),n=daysIn(p[0],p[1]),rows=[];
  for(var i=1;i<=n;i++)rows.push({d:i,date:ym+'-'+pad(i),inc:0,out:0,sav:0,savPlan:0,debt:0});
  S.tx.forEach(function(t){if(t.date.slice(0,7)===ym){var r=rows[+t.date.slice(8)-1];if(r){t.type==='in'?r.inc+=t.amount:r.out+=t.amount}}});
  S.sav.forEach(function(t){if(t.date.slice(0,7)===ym){var r=rows[+t.date.slice(8)-1];if(r){t.done?r.sav+=t.amount:r.savPlan+=t.amount}}});
  S.debt.forEach(function(t){if(t.paid&&t.paidDate&&t.paidDate.slice(0,7)===ym){var r=rows[+t.paidDate.slice(8)-1];if(r)r.debt+=t.amount}});
  return rows;
}
function monthTotals(rows){
  return rows.reduce(function(a,r){a.inc+=r.inc;a.out+=r.out;a.sav+=r.sav;a.savPlan+=r.savPlan;a.debt+=r.debt;return a},{inc:0,out:0,sav:0,savPlan:0,debt:0});
}

/* ---------- render ---------- */
function render(){
  var p=V.ym.split('-').map(Number);
  $('#monthLabel').textContent=MONTHS[p[1]-1]+' '+p[0];
  $('#thisMonth').hidden=(V.ym===todayStr().slice(0,7));
  $('#bannerSlot').innerHTML=S.sample?'<div class="banner"><span><b>Ini data contoh</b> supaya Anda bisa melihat tampilannya. Catat milik Anda sendiri lewat form, lalu hapus contohnya.</span><button class="btn main" data-act="clear-sample">Hapus data contoh</button></div><div style="height:18px"></div>':'';
  var rows=byDay(V.ym),tot=monthTotals(rows);
  renderSummary(tot);
  renderChart(rows);
  renderTabs();
  var f={hari:panelDay,bulan:panelMonth,tabungan:panelSav,hutang:panelDebt}[V.tab];
  $('#panel').innerHTML=f(rows,tot);
}

function renderSummary(t){
  var bal=t.inc-t.out-t.sav-t.debt;
  var open=sum(S.debt.filter(function(d){return !d.paid}));
  $('#summary').innerHTML=
   '<div class="sum-main"><span class="lbl">Sisa uang bulan ini</span><strong class="big num'+(bal<0?' neg':'')+'">'+rpS(bal)+'</strong>'+
   '<span class="hint">Pemasukan dikurangi pengeluaran, tabungan, dan hutang yang sudah dibayar.</span></div>'+
   '<dl class="sum-grid">'+
   '<div style="--c:var(--in)"><dt>Pemasukan</dt><dd class="num">'+rp(t.inc)+'</dd></div>'+
   '<div style="--c:var(--out)"><dt>Pengeluaran</dt><dd class="num">'+rp(t.out)+'</dd></div>'+
   '<div style="--c:var(--sav)"><dt>Ditabung</dt><dd class="num">'+rp(t.sav)+'</dd><small>rencana '+rp(t.savPlan)+' lagi</small></div>'+
   '<div style="--c:var(--debt)"><dt>Hutang dibayar</dt><dd class="num">'+rp(t.debt)+'</dd><small>belum lunas '+rp(open)+'</small></div>'+
   '</dl>';
}

function niceStep(max){
  var p=Math.pow(10,Math.floor(Math.log10(max)));
  var ks=[1,2,5,10];
  for(var i=0;i<ks.length;i++){if(max/(ks[i]*p)<=4)return ks[i]*p}
  return 10*p;
}
function renderChart(rows){
  var W=720,H=230,L=46,R=8,T=12,B=26,pw=W-L-R,ph=H-T-B,n=rows.length;
  var mx=Math.max.apply(null,[100000].concat(rows.map(function(r){return Math.max(r.inc,r.out)})));
  var step=niceStep(mx),top=Math.ceil(mx/step)*step;
  var slot=pw/n,bw=Math.min(9,(slot-4)/2),td=todayStr();
  var y=function(v){return T+ph-v/top*ph};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafik pemasukan dan pengeluaran per hari">';
  for(var v=0;v<=top+1;v+=step){
    s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/>'+
       '<text class="ax" x="'+(L-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+short(v)+'</text>';
  }
  rows.forEach(function(r,i){
    var cx=L+slot*(i+.5),x0=L+slot*i;
    if(r.date===V.day)s+='<rect x="'+x0+'" y="'+T+'" width="'+slot+'" height="'+ph+'" rx="4" fill="var(--surface2)"/>';
    if(r.inc>0)s+='<rect x="'+(cx-bw-.5)+'" y="'+y(r.inc)+'" width="'+bw+'" height="'+(T+ph-y(r.inc))+'" rx="2" fill="var(--in)"/>';
    if(r.out>0)s+='<rect x="'+(cx+.5)+'" y="'+y(r.out)+'" width="'+bw+'" height="'+(T+ph-y(r.out))+'" rx="2" fill="var(--out)"/>';
    s+='<text class="ax'+(r.date===td?' today':'')+'" x="'+cx+'" y="'+(H-9)+'" text-anchor="middle">'+r.d+'</text>';
    s+='<rect class="hit" data-act="goday" data-day="'+r.date+'" x="'+x0+'" y="'+T+'" width="'+slot+'" height="'+(ph+B)+'"><title>'+r.d+' · masuk '+rp(r.inc)+' · keluar '+rp(r.out)+'</title></rect>';
  });
  s+='</svg>';
  $('#chart').innerHTML=s;
}

function renderTabs(){
  document.querySelectorAll('#tabs button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===V.tab?'true':'false')});
}

function rowHTML(it){
  var h='<li class="row'+(it.done?' done':'')+'" style="--c:var(--'+it.c+')">';
  if(it.check)h+='<label class="chk"><input type="checkbox" data-act="'+it.check+'" data-id="'+it.id+'"'+(it.checked?' checked':'')+' aria-label="'+esc(it.aria)+'"></label>';
  if(it.pill)h+='<span class="pill">'+it.pill+'</span>';
  h+='<div class="r-main"><div class="r-title">'+esc(it.title)+(it.badge||'')+'</div>'+(it.sub?'<div class="r-sub">'+esc(it.sub)+'</div>':'')+'</div>';
  h+='<div class="r-amt num">'+(it.sign||'')+rp(it.amount)+'</div>';
  h+='<button class="x" data-act="del" data-kind="'+it.kind+'" data-id="'+it.id+'" aria-label="Hapus">×</button></li>';
  return h;
}

function panelDay(rows){
  var date=V.day,r=rows[+date.slice(8)-1]||{inc:0,out:0,sav:0,savPlan:0,debt:0};
  var items=[];
  S.tx.filter(function(t){return t.date===date&&t.type==='in'}).forEach(function(t){items.push({kind:'tx',id:t.id,c:'in',pill:'Masuk',title:t.note||t.cat,sub:t.cat,amount:t.amount,sign:'+'})});
  S.tx.filter(function(t){return t.date===date&&t.type==='out'}).forEach(function(t){items.push({kind:'tx',id:t.id,c:'out',pill:'Keluar',title:t.note||t.cat,sub:t.cat,amount:t.amount,sign:'−'})});
  S.sav.filter(function(t){return t.date===date}).forEach(function(t){items.push({kind:'sav',id:t.id,c:'sav',check:'tgl-sav',checked:t.done,done:t.done,aria:'Sudah ditabung',pill:'Tabung',title:t.note||'Tabungan',sub:t.done?'Sudah ditabung':'Rencana, belum ditabung',amount:t.amount})});
  S.debt.forEach(function(t){
    if(t.paid&&t.paidDate===date)items.push({kind:'debt',id:t.id,c:'debt',check:'tgl-debt',checked:true,done:true,aria:'Sudah terbayar',pill:'Hutang',title:t.name,sub:'Sudah terbayar',amount:t.amount,sign:'−'});
    else if(!t.paid&&t.due===date)items.push({kind:'debt',id:t.id,c:'debt',check:'tgl-debt',checked:false,aria:'Sudah terbayar',pill:'Hutang',title:t.name,sub:'Jatuh tempo hari ini',amount:t.amount,sign:'−'});
  });
  var net=r.inc-r.out-r.sav-r.debt;
  return '<div class="daybar"><button class="btn" data-act="prev-day" aria-label="Hari sebelumnya">‹</button>'+
    '<input type="date" id="dayPick" value="'+date+'" aria-label="Pilih tanggal">'+
    '<button class="btn" data-act="next-day" aria-label="Hari berikutnya">›</button>'+
    '<button class="btn" data-act="today">Hari ini</button></div>'+
    '<h3 class="ttl">'+fmtDate(date,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</h3>'+
    '<div class="mini"><div><span>Masuk</span><b class="num pos">'+rp(r.inc)+'</b></div><div><span>Keluar</span><b class="num neg">'+rp(r.out)+'</b></div>'+
    '<div><span>Ditabung</span><b class="num">'+rp(r.sav)+'</b></div><div><span>Sisa hari ini</span><b class="num '+(net<0?'neg':'')+'">'+rpS(net)+'</b></div></div>'+
    (items.length?'<ul class="rows">'+items.map(rowHTML).join('')+'</ul>':'<p class="empty">Belum ada catatan pada tanggal ini. Isi form untuk menambahkannya.</p>');
}

function panelMonth(rows,tot){
  var act=rows.filter(function(r){return r.inc||r.out||r.sav||r.savPlan||r.debt});
  var money=function(v,c){return v?'<span class="'+c+'">'+num(v)+'</span>':'<span style="color:var(--muted)">–</span>'};
  var tb=act.map(function(r){
    var net=r.inc-r.out-r.sav-r.debt;
    return '<tr'+(r.date===V.day?' class="sel"':'')+'><td><button class="link" data-act="goday" data-day="'+r.date+'" data-open="1">'+r.d+' '+MONTHS[+V.ym.slice(5)-1].slice(0,3)+'</button></td>'+
      '<td class="num">'+money(r.inc,'pos')+'</td><td class="num">'+money(r.out,'neg')+'</td>'+
      '<td class="num">'+(r.sav?num(r.sav):'<span style="color:var(--muted)">–</span>')+(r.savPlan?'<small>+'+num(r.savPlan)+' rencana</small>':'')+'</td>'+
      '<td class="num">'+(r.debt?num(r.debt):'<span style="color:var(--muted)">–</span>')+'</td>'+
      '<td class="num '+(net<0?'neg':'')+'">'+(net<0?'−':'')+num(Math.abs(net))+'</td></tr>';
  }).join('');
  var net=tot.inc-tot.out-tot.sav-tot.debt;
  var cats={};
  S.tx.forEach(function(t){if(t.type==='out'&&t.date.slice(0,7)===V.ym)cats[t.cat]=(cats[t.cat]||0)+t.amount});
  var cl=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a]});
  var cmax=cl.length?cats[cl[0]]:1;
  return '<h3 class="ttl">Rekap '+MONTHS[+V.ym.slice(5)-1]+' '+V.ym.slice(0,4)+'</h3>'+
    (act.length?'<div class="tw"><table><thead><tr><th>Tanggal</th><th>Masuk</th><th>Keluar</th><th>Ditabung</th><th>Hutang</th><th>Selisih</th></tr></thead><tbody>'+tb+'</tbody>'+
    '<tfoot><tr><td>Total</td><td class="num pos">'+num(tot.inc)+'</td><td class="num neg">'+num(tot.out)+'</td><td class="num">'+num(tot.sav)+'</td><td class="num">'+num(tot.debt)+'</td><td class="num '+(net<0?'neg':'')+'">'+(net<0?'−':'')+num(Math.abs(net))+'</td></tr></tfoot></table></div>'
    :'<p class="empty">Belum ada catatan di bulan ini.</p>')+
    '<p class="note">Angka dalam rupiah. Selisih = masuk − keluar − ditabung − hutang dibayar.</p>'+
    (cl.length?'<h4 class="sub-h">Pengeluaran per kategori</h4>'+cl.map(function(k){
      return '<div class="cat" style="--c:var(--out)"><span>'+esc(k)+'</span><div class="bar"><i style="width:'+Math.max(2,cats[k]/cmax*100)+'%"></i></div><span class="num">'+rp(cats[k])+'</span></div>';
    }).join(''):'');
}
function num(n){return Math.round(n).toLocaleString('id-ID')}

function panelSav(rows,tot){
  var target=S.targets[V.ym]||0;
  var pct=target>0?Math.min(100,Math.round(tot.sav/target*100)):0;
  var list=S.sav.filter(function(t){return t.date.slice(0,7)===V.ym}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
  var items=list.map(function(t){
    return rowHTML({kind:'sav',id:t.id,c:'sav',check:'tgl-sav',checked:t.done,done:t.done,aria:'Sudah ditabung '+fmtDate(t.date,{day:'numeric',month:'long'}),
      title:fmtDate(t.date,{weekday:'short',day:'numeric',month:'short'}),sub:(t.note||'Tabungan')+(t.done?' · sudah ditabung':''),amount:t.amount});
  }).join('');
  return '<div class="goal"><div class="goal-top"><label for="target">Target tabungan bulan ini</label>'+
    '<div class="amt"><span>Rp</span><input type="number" id="target" min="0" step="1" inputmode="numeric" value="'+(target||'')+'" placeholder="0"></div></div>'+
    '<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>'+
    '<div class="prog-t"><span><b class="num">'+rp(tot.sav)+'</b> sudah ditabung'+(target?' dari '+rp(target)+' ('+pct+'%)':'')+'</span><span class="num" style="color:var(--muted)">rencana '+rp(tot.savPlan)+' lagi</span></div></div>'+
    '<div class="plan"><div class="amt"><span>Rp</span><input type="number" id="planAmt" min="1" step="1" inputmode="numeric" placeholder="Per hari" aria-label="Jumlah tabungan per hari"></div>'+
    '<button class="btn" data-act="plan">Jadwalkan tiap hari</button></div>'+
    '<p class="note" style="margin:0 0 14px">Membuat satu tabungan untuk setiap tanggal bulan ini yang belum punya. Centang saat Anda sudah menabung.</p>'+
    (items?'<ul class="rows">'+items+'</ul>':'<p class="empty">Belum ada tabungan di bulan ini.</p>');
}

function panelDebt(){
  var td=todayStr();
  var open=S.debt.filter(function(d){return !d.paid}),paid=S.debt.filter(function(d){return d.paid});
  var list=open.sort(function(a,b){return a.due<b.due?-1:a.due>b.due?1:0}).concat(paid.sort(function(a,b){return a.paidDate<b.paidDate?1:-1}));
  var dueMonth=sum(open.filter(function(d){return d.due.slice(0,7)===V.ym}));
  var items=list.map(function(d){
    var badge='',sub='';
    if(d.paid){badge='<span class="badge ok">Lunas</span>';sub='Dibayar '+(d.paidDate?fmtDate(d.paidDate,{day:'numeric',month:'short',year:'numeric'}):'')}
    else{sub='Jatuh tempo '+fmtDate(d.due,{day:'numeric',month:'short',year:'numeric'});if(d.due<td)badge='<span class="badge">Lewat jatuh tempo</span>'}
    return rowHTML({kind:'debt',id:d.id,c:'debt',check:'tgl-debt',checked:d.paid,done:d.paid,aria:'Sudah terbayar: '+d.name,title:d.name,badge:badge,sub:sub,amount:d.amount});
  }).join('');
  return '<div class="mini three"><div><span>Belum dibayar</span><b class="num neg">'+rp(sum(open))+'</b></div><div><span>Sudah terbayar</span><b class="num pos">'+rp(sum(paid))+'</b></div><div><span>Jatuh tempo bulan ini</span><b class="num">'+rp(dueMonth)+'</b></div></div>'+
    (items?'<ul class="rows">'+items+'</ul>':'<p class="empty">Belum ada hutang tercatat.</p>')+
    '<p class="note">Centang saat hutang sudah dibayar. Jumlahnya langsung mengurangi sisa uang di bulan pembayaran, jadi tidak perlu dicatat lagi sebagai pengeluaran.</p>';
}

/* ---------- toast ---------- */
var tT;
function toast(msg,label,fn){
  var t=$('#toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(label?'<button class="tbtn" id="tAct">'+esc(label)+'</button>':'');
  t.hidden=false;
  if(label)$('#tAct').onclick=function(){fn();t.hidden=true};
  clearTimeout(tT);tT=setTimeout(function(){t.hidden=true},5000);
}

/* ---------- form ---------- */
var CFG={
  in:{c:'--in',name:'Keterangan',ph:'Contoh: gaji, order desain',date:'Tanggal',amt:'Jumlah',btn:'Catat pemasukan',cats:CAT_IN},
  out:{c:'--out',name:'Keterangan',ph:'Contoh: makan siang',date:'Tanggal',amt:'Jumlah',btn:'Catat pengeluaran',cats:CAT_OUT},
  sav:{c:'--sav',name:'Tujuan (opsional)',ph:'Contoh: dana darurat',date:'Tanggal menabung',amt:'Jumlah ditabung',btn:'Tambah tabungan',cats:null},
  debt:{c:'--debt',name:'Hutang kepada',ph:'Contoh: cicilan motor',date:'Jatuh tempo',amt:'Jumlah hutang',btn:'Catat hutang',cats:null}
};
function updateForm(){
  var c=CFG[V.type];
  $('#formcard').style.setProperty('--c','var('+c.c+')');
  $('#fNameLbl').textContent=c.name;$('#fName').placeholder=c.ph;
  $('#fDateLbl').textContent=c.date;$('#fAmtLbl').textContent=c.amt;
  $('#fSubmit').textContent=c.btn;
  $('#catWrap').hidden=!c.cats;
  if(c.cats)$('#fCat').innerHTML=c.cats.map(function(k){return '<option>'+esc(k)+'</option>'}).join('');
  $('#fErr').textContent='';
}
function syncDate(){$('#fDate').value=V.day}

document.querySelectorAll('input[name="ftype"]').forEach(function(r){r.addEventListener('change',function(){V.type=r.value;updateForm()})});
$('#form').addEventListener('submit',function(e){
  e.preventDefault();
  var type=V.type,date=$('#fDate').value,name=$('#fName').value.trim(),amount=Number($('#fAmt').value);
  var err=$('#fErr');
  if(!date){err.textContent='Pilih tanggalnya dulu.';return}
  if(!(amount>0)){err.textContent='Isi jumlah lebih dari nol.';return}
  if(type==='debt'&&!name){err.textContent='Isi hutang kepada siapa.';return}
  err.textContent='';
  if(type==='in'||type==='out'){
    S.tx.push({id:uid(),type:type,date:date,amount:amount,cat:$('#fCat').value,note:name});
    V.ym=date.slice(0,7);V.day=date;V.tab='hari';
  }else if(type==='sav'){
    S.sav.push({id:uid(),date:date,amount:amount,note:name,done:false});
    V.ym=date.slice(0,7);V.day=date;V.tab='tabungan';
  }else{
    S.debt.push({id:uid(),name:name,amount:amount,due:date,paid:false,paidDate:''});
    V.ym=date.slice(0,7);V.day=date;V.tab='hutang';
  }
  $('#fName').value='';$('#fAmt').value='';
  save();render();toast('Tersimpan');
});

/* ---------- aksi ---------- */
function shiftMonth(k){
  var p=V.ym.split('-').map(Number),y=p[0],m=p[1]+k;
  if(m<1){m=12;y--}if(m>12){m=1;y++}
  V.ym=y+'-'+pad(m);
  V.day=V.ym===todayStr().slice(0,7)?todayStr():V.ym+'-'+pad(Math.min(Number(V.day.slice(8)),daysIn(y,m)));
  syncDate();render();
}
function setDay(s){V.day=s;V.ym=s.slice(0,7);syncDate();render()}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='prev-month')shiftMonth(-1);
  else if(a==='next-month')shiftMonth(1);
  else if(a==='this-month'){V.ym=todayStr().slice(0,7);V.day=todayStr();syncDate();render()}
  else if(a==='tab'){V.tab=b.dataset.tab;render()}
  else if(a==='prev-day')setDay(addDays(V.day,-1));
  else if(a==='next-day')setDay(addDays(V.day,1));
  else if(a==='today')setDay(todayStr());
  else if(a==='goday'){V.day=b.dataset.day;V.tab='hari';syncDate();render();var t=$('#tabs');if(b.dataset.open&&t&&t.scrollIntoView)t.scrollIntoView({block:'start'})}
  else if(a==='del')del(b.dataset.kind,b.dataset.id);
  else if(a==='plan')plan();
  else if(a==='clear-sample'){
    S.tx=S.tx.filter(function(x){return !x.ex});S.sav=S.sav.filter(function(x){return !x.ex});S.debt=S.debt.filter(function(x){return !x.ex});
    S.targets={};S.sample=false;save();render();toast('Data contoh dihapus')
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='dayPick'&&t.value){setDay(t.value);return}
  if(t.id==='target'){S.targets[V.ym]=Math.max(0,Number(t.value)||0);save();render();return}
  var a=t.dataset&&t.dataset.act;
  if(a==='tgl-sav'){var s=S.sav.find(function(x){return x.id===t.dataset.id});if(s){s.done=t.checked;save();render()}}
  if(a==='tgl-debt'){var d=S.debt.find(function(x){return x.id===t.dataset.id});if(d){d.paid=t.checked;d.paidDate=t.checked?todayStr():'';save();render()}}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='planAmt'){e.preventDefault();plan()}});

function del(kind,id){
  var arr=S[kind];if(!arr)return;
  var i=arr.findIndex(function(x){return x.id===id});if(i<0)return;
  var it=arr.splice(i,1)[0];
  save();render();
  toast('Entri dihapus','Urungkan',function(){S[kind].splice(Math.min(i,S[kind].length),0,it);save();render()});
}
function plan(){
  var amt=Number(($('#planAmt')||{}).value);
  if(!(amt>0)){toast('Isi jumlah tabungan per hari dulu');return}
  var n=0;
  byDay(V.ym).forEach(function(r){
    if(!S.sav.some(function(s){return s.date===r.date})){S.sav.push({id:uid(),date:r.date,amount:amt,note:'Tabungan harian',done:false});n++}
  });
  save();render();
  toast(n?n+' tanggal dijadwalkan':'Semua tanggal sudah punya tabungan');
}

/* ---------- mulai ---------- */
var loc=loadLocal();
S=loc||makeSample();
updateForm();syncDate();render();
initAuth();
})();
</script>
</body>
</html>
